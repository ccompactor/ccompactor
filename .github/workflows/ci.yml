name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the product ships to. A CLI that only builds on
        # the maintainer's laptop is a CLI that breaks on release day.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 is what `engines` still promises, so it stays under test; 22 and 24
        # are the maintained lines.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: the binary runs
        run: node packages/ccompactor/dist/cli.js --version
      - name: the publish guard is doing its job
        run: node packages/ccompactor/scripts/guard-vendor.mjs
